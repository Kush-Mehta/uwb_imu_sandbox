# Parameters of the sandbox nodes (all run on simulation time)
uwb_node:
  ros__parameters:
    use_sim_time: true
    serial_topic: /sandbox/uwb/serial
    truth_topic: /sandbox/uwb/truth
    tag_id: 1
    tag_frame: uwb_tag
    anchor_ids: [1, 2, 3, 4]
    memory_timeout: 0.8      # [s] a range older than this becomes NaN in /uwb/ranges
    array_rate: 20.0         # [Hz] rate of /uwb/ranges
    udp_forward: false       # true: also send every range as JSON over UDP
    udp_host: 127.0.0.1
    udp_port: 9999

imu_node:
  ros__parameters:
    use_sim_time: true
    input_topic: /sandbox/imu/raw
    frame_id: base_link

algorithm_node:
  ros__parameters:
    use_sim_time: true

demo_driver:
  ros__parameters:
    use_sim_time: true
    speed: 0.5
    loop: true
